apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault-issuer # DO NOT CHANGE this name: vcfa_tenant_bootstrap.sh finds this manifest by Kind Issuer + this name (the file itself can be renamed)
  namespace: namespace
spec:
  vault:
    server: server
    path: pki_int/sign/pki_intermediate_role
    caBundle: caBundle
    auth:
      tokenSecretRef:
        name: cert-manager-vault-token # must match the Secret (secret_vault.yaml)
        key: token