apiVersion: v1
kind: ConfigMap
metadata:
  name: php2shell-demo-app
data:
  index.php: |
    <?php
    session_start();
    header('Content-Type: text/plain');
    echo "PHP2Shell demo app - lab only\n";
    echo "PHP version: " . phpversion() . "\n";
    echo "Session ID: " . session_id() . "\n";
    if (isset($_POST['PHPSESSID'])) {
        echo "Received PHPSESSID form field: " . $_POST['PHPSESSID'] . "\n";
    }
    if (isset($_POST['PHP_SESSION_UPLOAD_PROGRESS'])) {
        echo "Received PHP_SESSION_UPLOAD_PROGRESS: " . $_POST['PHP_SESSION_UPLOAD_PROGRESS'] . "\n";
    }
    if (!empty($_FILES['file']) && $_FILES['file']['error'] === UPLOAD_ERR_OK) {
        $dir = '/tmp/uploads';
        if (!is_dir($dir)) { mkdir($dir, 0777, true); }
        $name = basename($_FILES['file']['name']);
        $dest = $dir . '/' . $name;
        if (move_uploaded_file($_FILES['file']['tmp_name'], $dest)) {
            echo "Uploaded and stored as: $name\n";
        } else {
            echo "Upload failed\n";
        }
    } else {
        echo "POST a file as 'file' to upload.\n";
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-front3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-selector-v3
  template:
    metadata:
      name: web-front3
      labels:
        app: app-selector-v3
    spec:
      containers:
        - name: web-front3
          image: harbor.avi.vcf9.lab/registry/php:8.3.35-apache
          ports:
            - containerPort: 80
          volumeMounts:
            - name: app
              mountPath: /var/www/html/index.php
              subPath: index.php
      volumes:
        - name: app
          configMap:
            name: php2shell-demo-app
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: svc-v3
spec:
  selector:
    app: app-selector-v3
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: gw-gitops
spec:
  gatewayClassName: avi-lb
  listeners:
    - name: foo-http
      protocol: HTTP
      port: 80
      hostname: "*.mydomain.com"
    - name: bar-https
      protocol: HTTPS
      port: 443
      hostname: "*.mydomain.com"
      tls:
        certificateRefs:
          - kind: Secret
            group: ""
            name: cert01
---
apiVersion: ako.vmware.com/v1alpha2
kind: L7Rule
metadata:
  name: l7-rule-waf-detection
  namespace: default
spec:
  wafPolicy:
    kind: AviRef
    name: System-WAF-Policy-Detection
  analyticsPolicy:
    fullClientLogs:
      enabled: true
      throttle: HIGH
      duration: 0
    logAllHeaders: true
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: http-route-gitops
spec:
  parentRefs:
    - name: gw-gitops
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: ako.vmware.com
            kind: L7Rule
            name: l7-rule-waf-detection
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: svc-v3
          port: 80
  hostnames:
    - "virtual-patching.mydomain.com"